name: Deployed site acceptance

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: Live site and isolated dry run (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium, firefox]
    env:
      MAC_SETUP_EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:production -- --browser=${{ matrix.browser }}
      - name: Preserve deployed-site acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-site-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/production/
            playwright-report/production/
          if-no-files-found: warn
          retention-days: 7
