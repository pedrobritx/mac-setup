name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Lint & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          curl -sSL "https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64" \
            -o /usr/local/bin/shfmt && sudo chmod +x /usr/local/bin/shfmt

      - name: Bash syntax check
        run: |
          set -e
          for f in $(git ls-files '*.sh'); do
            bash -n "$f"
          done

      - name: ShellCheck
        run: shellcheck $(git ls-files '*.sh')

      - name: shfmt (format check)
        run: shfmt -d -i 2 -ci $(git ls-files '*.sh')

      - name: Dry-run smoke test
        env:
          MAC_SETUP_TEST: "1"
        run: |
          ./install.sh --help
          ./install.sh --list
          ./install.sh --dry-run --yes
          ./install.sh --dry-run --britx

  browser:
    name: Browser plans & local companion (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:catalog
      - run: npm run check:format
      - run: npm test
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --browser=${{ matrix.browser }}
      - name: Preserve browser results and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
